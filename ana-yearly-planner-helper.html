<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7c3aed">
<title>Ana Yearly Planner — Step-by-Step Helper v6</title>
<style>
:root{
  --scale:1;
  --ink:#18212f;
  --purple:#7c3aed;
  --blue:#2563eb;
  --green:#16a34a;
  --soft:#f6f3ff;
  --shadow:0 18px 50px rgba(50,35,90,.15);
}
*{box-sizing:border-box}
html,body{
  margin:0;min-height:100%;
  background:
    radial-gradient(circle at top left,#efe6ff 0,transparent 34%),
    radial-gradient(circle at bottom right,#dff4ff 0,transparent 33%),
    #f7f8fc;
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif
}
body{font-size:calc(18px * var(--scale))}
button,a{font:inherit}
.shell{max-width:760px;margin:0 auto;padding:max(18px,env(safe-area-inset-top)) 14px max(30px,env(safe-area-inset-bottom))}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.brand{font-weight:950;font-size:1.02em}
.version{font-size:.72em;color:#6b6478;font-weight:850;margin-left:6px}
.fonttools{display:flex;gap:8px}
.smallbtn{min-width:52px;min-height:44px;border:1px solid #d8d3e6;background:#fff;color:#3d3554;border-radius:14px;font-weight:900;box-shadow:0 5px 16px rgba(55,45,80,.08)}
.card{background:#fff;border:1px solid rgba(124,58,237,.12);border-radius:28px;box-shadow:var(--shadow);overflow:hidden}
.hero{padding:22px 20px 18px;background:linear-gradient(135deg,#6d28d9,#8b5cf6 58%,#2563eb);color:#fff;text-align:center}
.hero .eyebrow{font-weight:850;opacity:.92;font-size:.78em;letter-spacing:.8px;text-transform:uppercase}
.hero h1{font-size:clamp(30px,7vw,48px);line-height:1.02;margin:8px 0 9px;font-weight:950}
.hero p{margin:0 auto;max-width:620px;font-size:1.02em;line-height:1.45}
.progress-wrap{padding:16px 20px 0}
.step-label{color:var(--purple);font-weight:950;text-align:center;margin-bottom:8px;font-size:1.05em}
.progress{height:13px;background:#ece8f5;border-radius:999px;overflow:hidden}
.progress>div{height:100%;width:0;background:linear-gradient(90deg,var(--purple),var(--blue));transition:width .25s ease}
.stage{min-height:465px;padding:26px 22px 24px;text-align:center;display:flex;flex-direction:column;justify-content:center}
.icon{width:104px;height:104px;border-radius:28px;margin:0 auto 18px;display:grid;place-items:center;font-size:56px;background:var(--soft);border:1px solid #e7dcff;box-shadow:inset 0 0 0 6px rgba(255,255,255,.7)}
.stage h2{font-size:clamp(29px,6vw,43px);line-height:1.07;margin:0 0 15px;font-weight:950}
.stage>p{font-size:clamp(20px,4.5vw,28px);line-height:1.45;margin:0 auto 14px;max-width:640px}
.note{margin:14px auto 0;max-width:630px;padding:14px 16px;border-radius:18px;background:#fff8df;border:1px solid #f6d46a;color:#614b00;font-size:.88em;line-height:1.45;text-align:left}
.note.green{background:#ebfaef;border-color:#b8e8c3;color:#185b27}
.note.blue{background:#eaf3ff;border-color:#b8d4ff;color:#163c73}
.note.red{background:#fff0f0;border-color:#f2bbbb;color:#7a1d1d}
.choice-area{display:grid;grid-template-columns:1fr;gap:14px;max-width:620px;width:100%;margin:18px auto 5px}
.choice-btn{min-height:84px;border:0;border-radius:22px;padding:18px;font-size:clamp(22px,4.8vw,30px);font-weight:950;color:#fff;cursor:pointer;box-shadow:0 12px 26px rgba(65,55,130,.14)}
.choice-btn.purple{background:linear-gradient(135deg,#7c3aed,#4f46e5)}
.choice-btn.blue{background:linear-gradient(135deg,#0ea5e9,#2563eb)}
.choice-hint{color:#5b6474!important;font-size:clamp(17px,3.8vw,22px)!important;max-width:610px!important}
.sequence{width:100%;max-width:640px;margin:16px auto 4px;display:grid;gap:11px;text-align:left}
.seq{display:grid;grid-template-columns:46px 1fr;gap:12px;align-items:start;padding:14px 15px;border-radius:18px;background:#f8f6ff;border:1px solid #e1d9ff}
.seqnum{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--purple),var(--blue));color:#fff;font-weight:950;font-size:1.05em}
.seqtext{font-size:1.03em;line-height:1.38}
.planner-link{display:block;text-decoration:none;color:#fff;background:linear-gradient(135deg,#16a34a,#22c55e);border-radius:22px;padding:19px 18px;margin:18px auto 8px;max-width:620px;font-size:1.1em;font-weight:950;box-shadow:0 12px 26px rgba(22,163,74,.23)}
.on-box{margin:15px auto 3px;max-width:620px;padding:16px;border-radius:20px;background:#edf9f0;border:2px solid #bde9c7;color:#175d28;font-weight:950;font-size:1em;line-height:1.45}
.mini-title{font-size:1.03em;font-weight:950;color:#4f3b7d;margin:14px 0 4px}
.nav{display:grid;grid-template-columns:1fr 1.45fr;gap:12px;padding:0 20px 22px}
.nav button{min-height:62px;border:0;border-radius:18px;font-weight:950;font-size:1.03em;cursor:pointer}
#backBtn{background:#eceff4;color:#394150}
#nextBtn{background:linear-gradient(135deg,var(--purple),var(--blue));color:#fff;box-shadow:0 10px 24px rgba(75,70,200,.22)}
#nextBtn:disabled{background:#d7d9e0;color:#747986;box-shadow:none}
.footer-actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:14px}
.footer-actions button{border:1px solid #d9d4e6;background:rgba(255,255,255,.9);color:#4c4760;border-radius:999px;padding:9px 15px;font-weight:850}
.big-check{width:124px;height:124px;border-radius:50%;background:#eaf9ee;border:5px solid #bbebc6;margin:0 auto 18px;display:grid;place-items:center;font-size:72px}
.done-badge{display:inline-block;background:#eaf9ee;color:#167333;border:2px solid #bce7c7;border-radius:999px;padding:7px 14px;font-weight:950;margin-bottom:14px}
@media(max-width:480px){
  .shell{padding-left:9px;padding-right:9px}
  .card{border-radius:23px}
  .hero{padding:19px 14px 16px}
  .stage{padding:22px 14px 20px;min-height:460px}
  .nav{padding-left:13px;padding-right:13px}
  .icon{width:94px;height:94px;font-size:49px}
  .seq{grid-template-columns:42px 1fr;padding:12px}
  .seqnum{width:38px;height:38px}
}
</style>
</head>
<body>
<div class="shell">
  <div class="topbar">
    <div class="brand">📱 Palacios Step-by-Step Helper <span class="version">v6</span></div>
    <div class="fonttools">
      <button class="smallbtn" id="fontDown">A−</button>
      <button class="smallbtn" id="fontUp">A+</button>
    </div>
  </div>

  <main class="card">
    <header class="hero">
      <div class="eyebrow">Ana's iPhone Helper</div>
      <h1>Ana Yearly Planner</h1>
      <p>Look first. Come back. Tell the Helper what you saw.</p>
    </header>

    <div class="progress-wrap">
      <div class="step-label" id="stepLabel"></div>
      <div class="progress"><div id="bar"></div></div>
    </div>

    <section class="stage" id="stage" aria-live="polite"></section>

    <nav class="nav">
      <button id="backBtn">← BACK</button>
      <button id="nextBtn">I DID IT →</button>
    </nav>
  </main>

  <div class="footer-actions">
    <button id="restartBtn">↻ Start Over</button>
    <button id="helpBtn">? Help</button>
  </div>
</div>

<script>
const plannerURL = 'https://rpalaciosgithub.github.io/ana-yearly-planner/Ana-Yearly-Planner.html';

let removalChoice = localStorage.getItem("anaV6Removal") || "";
let browserChoice = localStorage.getItem("anaV6Browser") || "";

function screens(){
  const arr = [
    {
      id:"intro", intro:true, icon:"📱", title:"Hi Ana!",
      body:`This Helper will help you replace the old Ana Yearly Planner with the newest version.`,
      extra:`<div class="on-box">You will sometimes go look at something on the iPhone, then come back and tell the Helper what you saw.</div>`,
      note:`You do not have to memorize both possibilities. The Helper will give you only the instructions you need.`,
      noteClass:"green", next:"LET'S START →"
    },
    {
      id:"find", icon:"🔎", title:"Find the old planner",
      body:`Go to the Home Screen and find the <strong>Ana Yearly Planner</strong> icon.`,
      note:`When you find it, return here and tap <strong>I DID IT</strong>.`, noteClass:"blue"
    },
    {
      id:"inspect-delete", icon:"👀", title:"Look — don't delete yet",
      body:`Go to the old planner icon and <strong>press and hold it</strong>.`,
      extra:`<div class="on-box">Do NOT tap anything yet.<br><br>Look for either:<br><strong>Remove App</strong><br>or<br><strong>Delete Bookmark</strong></div>`,
      note:`Remember which one you saw. Then return to the Helper. It is okay if that menu disappears.`,
      noteClass:"blue", next:"I SAW THE MENU →"
    },
    {
      id:"delete-choice", choice:"delete", icon:"❓", title:"What did you see?",
      body:`Tap the button that matches the option you saw on the iPhone.`
    }
  ];

  if(removalChoice === "bookmark"){
    arr.push({
      id:"delete-bookmark", icon:"🔖", title:"Your exact delete path",
      body:`Now go back to the old planner and do only this sequence:`,
      extra:`
        <div class="sequence">
          <div class="seq"><div class="seqnum">1</div><div class="seqtext"><strong>Press and hold</strong> the planner icon again.</div></div>
          <div class="seq"><div class="seqnum">2</div><div class="seqtext">Tap <strong>Delete Bookmark</strong>.</div></div>
          <div class="seq"><div class="seqnum">3</div><div class="seqtext">Tap <strong>Delete</strong> to confirm.</div></div>
        </div>`,
      note:`Return to the Helper only after the old planner icon disappears.`,
      noteClass:"green", next:"OLD PLANNER IS GONE →"
    });
  } else if(removalChoice === "remove"){
    arr.push({
      id:"delete-app", icon:"🗑️", title:"Your exact delete path",
      body:`Now go back to the old planner and do only this sequence:`,
      extra:`
        <div class="sequence">
          <div class="seq"><div class="seqnum">1</div><div class="seqtext"><strong>Press and hold</strong> the planner icon again.</div></div>
          <div class="seq"><div class="seqnum">2</div><div class="seqtext">Tap <strong>Remove App</strong>.</div></div>
          <div class="seq"><div class="seqnum">3</div><div class="seqtext">Tap <strong>Delete App</strong>, then tap <strong>Delete</strong>.</div></div>
        </div>`,
      note:`Return to the Helper only after the old planner icon disappears.`,
      noteClass:"green", next:"OLD PLANNER IS GONE →"
    });
  }

  if(removalChoice){
    arr.push(
      {
        id:"open-new", icon:"🌐", title:"Open the NEW planner",
        body:`You do <strong>not</strong> need another text message from Dad. Tap the green button below.`,
        extra:`<a class="planner-link" href="${plannerURL}" target="_blank" rel="noopener">OPEN NEW ANA YEARLY PLANNER ↗</a>`,
        note:`When the new planner is open, return to this Helper before doing anything else.`,
        noteClass:"blue", next:"NEW PLANNER IS OPEN →"
      },
      {
        id:"inspect-browser", icon:"👀", title:"Look at the bottom-right",
        body:`Go to the <strong>new planner</strong>. Look at the bottom-right of the screen.`,
        extra:`<div class="on-box">Do NOT tap anything yet.<br><br>Do you see:<br><strong>••• THREE DOTS</strong><br>or<br><strong>SHARE</strong>?</div>`,
        note:`Remember what you saw, then return to the Helper.`,
        noteClass:"blue", next:"I LOOKED →"
      },
      {
        id:"browser-choice", choice:"browser", icon:"❓", title:"What did you see?",
        body:`Tap the button that matches what you saw at the bottom-right.`
      }
    );
  }

  if(browserChoice){
    const shareStart = browserChoice === "dots"
      ? `<div class="seq"><div class="seqnum">1</div><div class="seqtext">Tap <strong>•••</strong>, then tap <strong>Share</strong>.</div></div>`
      : `<div class="seq"><div class="seqnum">1</div><div class="seqtext">Tap <strong>Share</strong>.</div></div>`;

    arr.push({
      id:"install", icon:"➕", title:"Install the new planner",
      body:`You already know how to open the Share screen. Now follow only this path:`,
      extra:`
        <div class="sequence">
          ${shareStart}
          <div class="seq"><div class="seqnum">2</div><div class="seqtext">Scroll down and tap <strong>Add to Home Screen</strong>.</div></div>
          <div class="seq"><div class="seqnum">3</div><div class="seqtext">Make sure <strong>Open as Web App</strong> is ON/green, then tap <strong>Add</strong>.</div></div>
        </div>`,
      note:`Stay with this sequence until the new planner icon appears on the Home Screen.`,
      noteClass:"green", next:"NEW ICON IS ON HOME SCREEN →"
    });

    arr.push({
      id:"verify", icon:"✅", title:"Test the new planner",
      body:`Tap the new <strong>Ana Yearly Planner</strong> icon on the Home Screen.`,
      note:`Make sure it opens correctly. Then return here one last time.`,
      noteClass:"blue", next:"IT WORKS! →"
    });

    arr.push({
      id:"done", done:true, title:"ANOTHER SUCCESS!",
      body:`The newest <strong>Ana Yearly Planner</strong> is installed and working.`,
      extra:`<div class="big-check">✓</div><div class="done-badge">UPDATE COMPLETE</div>`,
      note:`The UNhelper has been fired. 😄`, noteClass:"green", next:"FINISHED ✓"
    });
  }

  return arr;
}

let currentId = localStorage.getItem("anaV6Screen") || "intro";
let scale = Number(localStorage.getItem("anaV6Font") || 1);
if(!Number.isFinite(scale)) scale=1;
scale=Math.min(1.3,Math.max(.9,scale));
document.documentElement.style.setProperty("--scale",scale);

const stage=document.getElementById("stage");
const stepLabel=document.getElementById("stepLabel");
const bar=document.getElementById("bar");
const backBtn=document.getElementById("backBtn");
const nextBtn=document.getElementById("nextBtn");

function getIndex(flow){
  let i=flow.findIndex(s=>s.id===currentId);
  if(i<0){currentId="intro";i=0;}
  return i;
}

function render(){
  const flow=screens();
  const idx=getIndex(flow);
  const s=flow[idx];
  const isChoice=!!s.choice;
  const isDone=!!s.done;

  if(s.intro){stepLabel.textContent="READY TO BEGIN";bar.style.width="0%";}
  else if(isDone){stepLabel.textContent="ALL STEPS COMPLETE";bar.style.width="100%";}
  else{stepLabel.textContent=`STEP ${idx}`;bar.style.width=`${Math.max(5,(idx/(flow.length-1))*100)}%`;}

  let extra=s.extra||"";
  if(s.choice==="delete"){
    extra=`
      <div class="choice-area">
        <button class="choice-btn purple" data-delete="remove">🗑️ REMOVE APP</button>
        <button class="choice-btn blue" data-delete="bookmark">🔖 DELETE BOOKMARK</button>
      </div>
      <p class="choice-hint">Choose only what you actually saw.</p>`;
  }
  if(s.choice==="browser"){
    extra=`
      <div class="choice-area">
        <button class="choice-btn purple" data-browser="dots">••• THREE DOTS</button>
        <button class="choice-btn blue" data-browser="share">⬆️ SHARE</button>
      </div>
      <p class="choice-hint">Choose only what you actually saw.</p>`;
  }

  stage.innerHTML=`
    ${isDone ? (s.extra||"") : `<div class="icon">${s.icon||"✓"}</div>`}
    <h2>${s.title}</h2>
    <p>${s.body||""}</p>
    ${!isDone?extra:""}
    ${s.note?`<div class="note ${s.noteClass||""}">${s.note}</div>`:""}
  `;

  backBtn.disabled=idx===0;
  backBtn.style.opacity=idx===0?".45":"1";

  if(isChoice){
    nextBtn.disabled=true;
    nextBtn.textContent="CHOOSE ABOVE";
  }else{
    nextBtn.disabled=false;
    nextBtn.textContent=s.next||(isDone?"FINISHED ✓":"I DID IT →");
    nextBtn.style.background=isDone
      ?"linear-gradient(135deg,#16a34a,#22c55e)"
      :"linear-gradient(135deg,#7c3aed,#2563eb)";
  }

  document.querySelectorAll("[data-delete]").forEach(btn=>{
    btn.addEventListener("click",()=>{
      removalChoice=btn.dataset.delete;
      localStorage.setItem("anaV6Removal",removalChoice);
      const f=screens();
      const choiceIndex=f.findIndex(x=>x.id==="delete-choice");
      currentId=f[choiceIndex+1].id;
      saveRender();
    });
  });

  document.querySelectorAll("[data-browser]").forEach(btn=>{
    btn.addEventListener("click",()=>{
      browserChoice=btn.dataset.browser;
      localStorage.setItem("anaV6Browser",browserChoice);
      const f=screens();
      const choiceIndex=f.findIndex(x=>x.id==="browser-choice");
      currentId=f[choiceIndex+1].id;
      saveRender();
    });
  });

  localStorage.setItem("anaV6Screen",currentId);
  window.scrollTo({top:0,behavior:"smooth"});
}

function saveRender(){
  localStorage.setItem("anaV6Screen",currentId);
  render();
}

nextBtn.addEventListener("click",()=>{
  if(nextBtn.disabled)return;
  const flow=screens();
  const idx=getIndex(flow);
  if(idx<flow.length-1){currentId=flow[idx+1].id;saveRender();}
  else alert("Another success! 🎉");
});

backBtn.addEventListener("click",()=>{
  const flow=screens();
  const idx=getIndex(flow);
  if(idx>0){currentId=flow[idx-1].id;saveRender();}
});

document.getElementById("restartBtn").addEventListener("click",()=>{
  if(confirm("Start again from the beginning?")){
    removalChoice="";
    browserChoice="";
    currentId="intro";
    localStorage.removeItem("anaV6Removal");
    localStorage.removeItem("anaV6Browser");
    saveRender();
  }
});

document.getElementById("helpBtn").addEventListener("click",()=>{
  alert(`HELP

The v6 rule is:

LOOK FIRST
→ COME BACK
→ TELL THE HELPER WHAT YOU SAW
→ GET ONLY YOUR INSTRUCTIONS

BACK stays available on every screen.

The Helper never makes you read both deletion paths at once.`);
});

document.getElementById("fontDown").addEventListener("click",()=>{
  scale=Math.max(.9,+(scale-.1).toFixed(1));
  document.documentElement.style.setProperty("--scale",scale);
  localStorage.setItem("anaV6Font",scale);
});
document.getElementById("fontUp").addEventListener("click",()=>{
  scale=Math.min(1.3,+(scale+.1).toFixed(1));
  document.documentElement.style.setProperty("--scale",scale);
  localStorage.setItem("anaV6Font",scale);
});

render();
</script>
</body>
</html>
