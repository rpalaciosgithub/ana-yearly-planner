<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7c3aed">
<title>Ana Yearly Planner — Step-by-Step Helper v8</title>
<style>
:root{--scale:1;--ink:#18212f;--purple:#7c3aed;--blue:#2563eb;--green:#16a34a;--soft:#f6f3ff;--shadow:0 18px 50px rgba(50,35,90,.15)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at top left,#efe6ff 0,transparent 34%),radial-gradient(circle at bottom right,#dff4ff 0,transparent 33%),#f7f8fc;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}body{font-size:calc(18px*var(--scale))}button,a{font:inherit}.shell{max-width:760px;margin:0 auto;padding:max(18px,env(safe-area-inset-top)) 14px max(30px,env(safe-area-inset-bottom))}.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}.brand{font-weight:950}.version{font-size:.72em;color:#6b6478}.fonttools{display:flex;gap:8px}.smallbtn{min-width:52px;min-height:44px;border:1px solid #d8d3e6;background:#fff;color:#3d3554;border-radius:14px;font-weight:900}.card{background:#fff;border:1px solid rgba(124,58,237,.12);border-radius:28px;box-shadow:var(--shadow);overflow:hidden}.hero{padding:22px 20px 18px;background:linear-gradient(135deg,#6d28d9,#8b5cf6 58%,#2563eb);color:#fff;text-align:center}.hero .eyebrow{font-weight:850;opacity:.92;font-size:.78em;letter-spacing:.8px;text-transform:uppercase}.hero h1{font-size:clamp(30px,7vw,48px);line-height:1.02;margin:8px 0 9px;font-weight:950}.hero p{margin:0 auto;max-width:620px;font-size:1.02em;line-height:1.45}.progress-wrap{padding:16px 20px 0}.step-label{color:var(--purple);font-weight:950;text-align:center;margin-bottom:8px;font-size:1.05em}.progress{height:13px;background:#ece8f5;border-radius:999px;overflow:hidden}.progress>div{height:100%;width:0;background:linear-gradient(90deg,var(--purple),var(--blue));transition:width .25s ease}.stage{min-height:465px;padding:26px 22px 24px;text-align:center;display:flex;flex-direction:column;justify-content:center}.icon{width:104px;height:104px;border-radius:28px;margin:0 auto 18px;display:grid;place-items:center;font-size:56px;background:var(--soft);border:1px solid #e7dcff}.stage h2{font-size:clamp(29px,6vw,43px);line-height:1.07;margin:0 0 15px;font-weight:950}.stage>p{font-size:clamp(20px,4.5vw,28px);line-height:1.45;margin:0 auto 14px;max-width:640px}.note{margin:14px auto 0;max-width:630px;padding:14px 16px;border-radius:18px;background:#fff8df;border:1px solid #f6d46a;color:#614b00;font-size:.88em;line-height:1.45;text-align:left}.note.green{background:#ebfaef;border-color:#b8e8c3;color:#185b27}.note.blue{background:#eaf3ff;border-color:#b8d4ff;color:#163c73}.choice-area{display:grid;grid-template-columns:1fr;gap:14px;max-width:620px;width:100%;margin:18px auto 5px}.choice-btn{min-height:84px;border:0;border-radius:22px;padding:18px;font-size:clamp(22px,4.8vw,30px);font-weight:950;color:#fff;cursor:pointer}.choice-btn.purple{background:linear-gradient(135deg,#7c3aed,#4f46e5)}.choice-btn.blue{background:linear-gradient(135deg,#0ea5e9,#2563eb)}.choice-hint{color:#5b6474!important;font-size:clamp(17px,3.8vw,22px)!important}.sequence{width:100%;max-width:640px;margin:16px auto 4px;display:grid;gap:11px;text-align:left}.seq{display:grid;grid-template-columns:46px 1fr;gap:12px;align-items:start;padding:14px 15px;border-radius:18px;background:#f8f6ff;border:1px solid #e1d9ff}.seqnum{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--purple),var(--blue));color:#fff;font-weight:950}.seqtext{font-size:1.03em;line-height:1.38}.planner-link{display:block;text-decoration:none;color:#fff;background:linear-gradient(135deg,#16a34a,#22c55e);border-radius:22px;padding:19px 18px;margin:18px auto 8px;max-width:620px;font-size:1.1em;font-weight:950;box-shadow:0 12px 26px rgba(22,163,74,.23)}.on-box{margin:15px auto 3px;max-width:620px;padding:16px;border-radius:20px;background:#edf9f0;border:2px solid #bde9c7;color:#175d28;font-weight:950;line-height:1.45}.nav{display:grid;grid-template-columns:1fr 1.45fr;gap:12px;padding:0 20px 22px}.nav button{min-height:62px;border:0;border-radius:18px;font-weight:950;font-size:1.03em}#backBtn{background:#eceff4;color:#394150}#nextBtn{background:linear-gradient(135deg,var(--purple),var(--blue));color:#fff}#nextBtn:disabled{background:#d7d9e0;color:#747986}.footer-actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:14px}.footer-actions button{border:1px solid #d9d4e6;background:#fff;color:#4c4760;border-radius:999px;padding:9px 15px;font-weight:850}@media(max-width:480px){.shell{padding-left:9px;padding-right:9px}.card{border-radius:23px}.hero{padding:19px 14px 16px}.stage{padding:22px 14px 20px;min-height:460px}.nav{padding-left:13px;padding-right:13px}.icon{width:94px;height:94px;font-size:49px}}
</style>
</head>
<body>
<div class="shell">
  <div class="topbar"><div class="brand">📱 Palacios Step-by-Step Helper <span class="version">v8</span></div><div class="fonttools"><button class="smallbtn" id="fontDown">A−</button><button class="smallbtn" id="fontUp">A+</button></div></div>
  <main class="card">
    <header class="hero"><div class="eyebrow">Ana's iPhone Helper</div><h1>Ana Yearly Planner</h1><p>The Helper removes the old planner. The new planner teaches Ana how to install itself.</p></header>
    <div class="progress-wrap"><div class="step-label" id="stepLabel"></div><div class="progress"><div id="bar"></div></div></div>
    <section class="stage" id="stage" aria-live="polite"></section>
    <nav class="nav"><button id="backBtn">← BACK</button><button id="nextBtn">I DID IT →</button></nav>
  </main>
  <div class="footer-actions"><button id="restartBtn">↻ Start Over</button><button id="helpBtn">? Help</button></div>
</div>
<script>
const plannerURL='https://rpalaciosgithub.github.io/ana-yearly-planner/Ana-Yearly-Planner.html?install=1';
let removalChoice=localStorage.getItem('anaV8Removal')||'';
function flow(){
 const a=[
  {id:'intro',intro:true,icon:'📱',title:'Hi Ana!',body:`Open this Helper from Dad's text message in <strong>Safari</strong>.`,extra:`<div class="on-box">Do <strong>not</strong> add the Helper to the Home Screen. Only the Ana Yearly Planner will be installed.</div>`,note:`The Helper's job is to remove the old planner and open the new one.`,noteClass:'green',next:`LET'S START →`},
  {id:'find',icon:'🔎',title:'Find the old planner',body:`Go to the Home Screen and find the <strong>Ana Yearly Planner</strong> icon.`,note:`When you find it, return here and tap I DID IT.`,noteClass:'blue'},
  {id:'inspect',icon:'👀',title:`Look — don't delete yet`,body:`Press and hold the old planner icon.`,extra:`<div class="on-box">Do NOT tap anything yet.<br><br>Look for <strong>Remove App</strong> or <strong>Delete Bookmark</strong>.</div>`,note:`Remember which one you saw, then return to the Helper. It is okay if the menu disappears.`,noteClass:'blue',next:'I SAW THE MENU →'},
  {id:'choice',choice:true,icon:'❓',title:'What did you see?',body:`Tap the option that matched your iPhone.`}
 ];
 if(removalChoice==='bookmark') a.push({id:'remove',icon:'🔖',title:'Delete the old planner',body:`Go back to the old planner and follow this short path:`,extra:`<div class="sequence"><div class="seq"><div class="seqnum">1</div><div class="seqtext"><strong>Press and hold</strong> the planner icon.</div></div><div class="seq"><div class="seqnum">2</div><div class="seqtext">Tap <strong>Delete Bookmark</strong>.</div></div><div class="seq"><div class="seqnum">3</div><div class="seqtext">Tap <strong>Delete</strong>.</div></div></div>`,note:`Return only after the old icon disappears.`,noteClass:'green',next:'OLD PLANNER IS GONE →'});
 if(removalChoice==='remove') a.push({id:'remove',icon:'🗑️',title:'Delete the old planner',body:`Go back to the old planner and follow this short path:`,extra:`<div class="sequence"><div class="seq"><div class="seqnum">1</div><div class="seqtext"><strong>Press and hold</strong> the planner icon.</div></div><div class="seq"><div class="seqnum">2</div><div class="seqtext">Tap <strong>Remove App</strong>.</div></div><div class="seq"><div class="seqnum">3</div><div class="seqtext">Tap <strong>Delete App</strong>, then <strong>Delete</strong>.</div></div></div>`,note:`Return only after the old icon disappears.`,noteClass:'green',next:'OLD PLANNER IS GONE →'});
 if(removalChoice){
  a.push({
    id:'open',
    icon:'🌐',
    title:'Open the NEW planner',
    body:`The Helper is finished after this. Tap the green button.`,
    extra:`<a class="planner-link" href="${plannerURL}" target="_blank" rel="noopener" onclick="prepareAllDone()">OPEN NEW ANA YEARLY PLANNER ↗</a><div class="on-box">When the new planner opens, <strong>stay there</strong>. A big <strong>INSTALL THIS PLANNER</strong> card will tell you exactly what to do. You do not need to come back to the Helper.</div>`,
    note:`The installation instructions now live inside the planner itself.`,
    noteClass:'green',
    next:'DONE'
  });
  a.push({
    id:'done',
    done:true,
    icon:'🎉',
    title:'ALL DONE!',
    body:`The Helper has finished its job.`,
    extra:`<div class="on-box"><strong>If the new Ana Yearly Planner is already on your Home Screen, you are finished.</strong><br><br>If you opened Safari again and found this Helper still here, you can now <strong>close this Helper tab</strong>.</div>`,
    note:`The Helper was only the instructor. The Ana Yearly Planner is the app you keep.`,
    noteClass:'green'
  });
}
 return a;
}
let currentId=localStorage.getItem('anaV8Screen')||'intro';let scale=Number(localStorage.getItem('anaV8Font')||1);if(!Number.isFinite(scale))scale=1;document.documentElement.style.setProperty('--scale',scale);
const stage=document.getElementById('stage'),stepLabel=document.getElementById('stepLabel'),bar=document.getElementById('bar'),backBtn=document.getElementById('backBtn'),nextBtn=document.getElementById('nextBtn');
function idxOf(f){let i=f.findIndex(x=>x.id===currentId);if(i<0){currentId='intro';i=0}return i}
function render(){const f=flow(),i=idxOf(f),s=f[i];stepLabel.textContent=s.intro?'READY TO BEGIN':(s.done?'ALL STEPS COMPLETE':`STEP ${i}`);bar.style.width=s.intro?'0%':(s.done?'100%':`${Math.max(5,(i/(f.length-1))*100)}%`);let extra=s.extra||'';if(s.choice)extra=`<div class="choice-area"><button class="choice-btn purple" data-choice="remove">🗑️ REMOVE APP</button><button class="choice-btn blue" data-choice="bookmark">🔖 DELETE BOOKMARK</button></div><p class="choice-hint">Choose only what you actually saw.</p>`;stage.innerHTML=`<div class="icon">${s.icon}</div><h2>${s.title}</h2><p>${s.body}</p>${extra}${s.note?`<div class="note ${s.noteClass||''}">${s.note}</div>`:''}`;backBtn.disabled=i===0;backBtn.style.opacity=i===0?'.45':'1';nextBtn.disabled=!!s.choice||s.id==='open'||!!s.done;nextBtn.textContent=s.choice?'CHOOSE ABOVE':s.id==='open'?'USE GREEN BUTTON':(s.done?'FINISHED ✓':(s.next||'I DID IT →'));document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{removalChoice=b.dataset.choice;localStorage.setItem('anaV8Removal',removalChoice);const nf=flow();const ci=nf.findIndex(x=>x.id==='choice');currentId=nf[ci+1].id;save()});localStorage.setItem('anaV8Screen',currentId);window.scrollTo({top:0,behavior:'smooth'})}
function prepareAllDone(){
  currentId='done';
  localStorage.setItem('anaV8Screen',currentId);
  setTimeout(render,0);
  return true;
}
function save(){localStorage.setItem('anaV8Screen',currentId);render()}nextBtn.onclick=()=>{if(nextBtn.disabled)return;const f=flow(),i=idxOf(f);if(i<f.length-1){currentId=f[i+1].id;save()}};backBtn.onclick=()=>{const f=flow(),i=idxOf(f);if(i>0){currentId=f[i-1].id;save()}};document.getElementById('restartBtn').onclick=()=>{if(confirm('Start again from the beginning?')){removalChoice='';currentId='intro';localStorage.removeItem('anaV8Removal');save()}};document.getElementById('helpBtn').onclick=()=>alert(`Helper v8:

1. Remove old planner.
2. Open new planner.
3. Stay in new planner.
4. Follow INSTALL THIS PLANNER card there.
5. After installation, if Safari shows the Helper again, close the Helper tab.`);document.getElementById('fontDown').onclick=()=>{scale=Math.max(.9,+(scale-.1).toFixed(1));document.documentElement.style.setProperty('--scale',scale);localStorage.setItem('anaV8Font',scale)};document.getElementById('fontUp').onclick=()=>{scale=Math.min(1.3,+(scale+.1).toFixed(1));document.documentElement.style.setProperty('--scale',scale);localStorage.setItem('anaV8Font',scale)};render();
</script>
</body></html>
